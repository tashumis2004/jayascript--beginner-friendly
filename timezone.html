<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>USA Time Zones</title>
  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body.dark {
      background-color: #1a202c; /* Tailwind gray-900 */
      color: #f7fafc; /* Tailwind gray-100 */
    }
    body.dark .card {
      background-color: #2d3748; /* Tailwind gray-800 */
      color: #f7fafc;
    }
    body.dark h1 {
      color: #63b3ed; /* Tailwind blue-400 */
    }
  </style>
</head>
<body class="bg-gray-100 transition duration-500">

  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="text-3xl font-bold text-blue-600">🕒 USA Time Zones</h1>
      <button id="toggleDark" class="btn btn-dark">🌙 Dark Mode</button>
    </div>
    <p class="text-center text-gray-600 mb-5">Current time in major US zones</p>

    <div id="times" class="row g-4 justify-content-center"></div>
  </div>

  <script>
    const zones = {
      "Eastern Time (ET)": "America/New_York",
      "Central Time (CT)": "America/Chicago",
      "Mountain Time (MT)": "America/Denver",

    };

    function updateTimes() {
      let output = "";
      for (const [name, zone] of Object.entries(zones)) {
        const time = new Date().toLocaleString("en-US", { timeZone: zone });
        output += `
          <div class="col-md-4">
            <div class="card shadow-lg border-0 rounded-lg hover:scale-105 transition transform duration-300">
              <div class="card-body text-center">
                <h5 class="card-title font-bold text-lg text-indigo-600">${name}</h5>
                <p class="card-text">${time}</p>
              </div>
            </div>
          </div>
        `;
      }
      document.getElementById("times").innerHTML = output;
    }

    updateTimes();
    setInterval(updateTimes, 1000); // auto update every second

    // Dark Mode Toggle
    document.getElementById("toggleDark").addEventListener("click", () => {
      document.body.classList.toggle("dark");
      const btn = document.getElementById("toggleDark");
      if (document.body.classList.contains("dark")) {
        btn.textContent = "☀️ Light Mode";
        btn.classList.remove("btn-dark");
        btn.classList.add("btn-light");
      } else {
        btn.textContent = "🌙 Dark Mode";
        btn.classList.remove("btn-light");
        btn.classList.add("btn-dark");
      }
    });
  </script>
</body>
</html>
